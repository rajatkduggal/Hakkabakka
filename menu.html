<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7b1113">
<title>Hakka Bakka Online Menu</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f3ec;color:#171717;font-family:Arial,sans-serif}
header{background:#7b1113;color:#fff;text-align:center;padding:28px 12px}
header h1{margin:0;font-size:32px}
header p{margin:8px 0;font-size:18px}
.search{position:sticky;top:0;z-index:10;background:#fff;padding:12px}
.search input{width:100%;padding:14px 16px;border:2px solid #7b1113;border-radius:12px;font-size:18px;background:#fff;color:#111}
main{padding-bottom:100px}
section{margin:18px 0}
.section-title{margin:0 12px 12px;background:#7b1113;color:#fff;padding:11px 14px;border-radius:10px;text-align:center;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0002;min-width:0}
.card img{display:block;width:100%;height:175px;object-fit:cover;background:#eee}
.content{padding:11px;text-align:center}
.content h3{font-size:16px;line-height:1.25;margin:0 0 8px}
.price{font-weight:bold;color:#7b1113;margin-bottom:9px}
.add{border:0;background:#7b1113;color:#fff;padding:9px 10px;border-radius:7px;font-weight:bold;cursor:pointer}
.variant-row{display:flex;gap:6px;justify-content:center}
.variant-row .add{flex:1;min-width:0;font-size:13px;padding:9px 5px}
.cart{position:fixed;right:16px;bottom:18px;z-index:30;border:0;border-radius:50%;width:64px;height:64px;background:#7b1113;color:#fff;font-size:24px;box-shadow:0 3px 10px #0005}
.badge{font-size:13px;background:#fff;color:#7b1113;border-radius:12px;padding:2px 6px}
.panel{display:none;position:fixed;inset:0 0 0 auto;width:min(430px,100%);background:#fff;z-index:40;padding:18px;overflow:auto;box-shadow:-4px 0 18px #0005}
.panel h2{margin-top:0;color:#7b1113}
.order-item{padding:10px 0;border-bottom:1px solid #ddd}
.panel input,.panel textarea,.panel select{width:100%;padding:11px;margin:6px 0;border:1px solid #aaa;border-radius:7px;font-size:16px}
.panel button.action{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#7b1113;color:#fff;font-weight:bold}
.panel button.close{background:#333}
.empty{text-align:center;padding:40px;color:#555}
#paymentBox{margin-top:14px;padding:14px;border:2px solid #7b1113;border-radius:10px;background:#fff8f0}
#qrbox{display:flex;justify-content:center;margin:10px 0}
#qrbox img{width:230px;height:230px}
#shareNote{font-size:13px;color:#555;text-align:center;margin-top:7px}
.remove{margin-top:5px;padding:5px 9px}
#deliveryInfo{font-size:14px;margin:4px 0 8px;padding:9px;border-radius:7px;background:#f7f3ec;color:#555}
.bill-summary{padding:10px 0;border-top:1px solid #ddd;margin-top:6px}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr);padding:0 10px;gap:10px}
  .card img{height:145px}
  .section-title{margin-left:10px;margin-right:10px}
}
@media(max-width:390px){
  .card img{height:125px}
  .content h3{font-size:14px}
}
</style>
</head>

const menu=document.getElementById('menu');
const panel=document.getElementById('panel');
const items=document.getElementById('items');

const utr=document.getElementById('utr');

const address=document.getElementById('address');

const phoneInput=document.getElementById('customerPhone');

function esc(s){
  return String(s).replace(/[&<>'"]/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[c]))
}

function itemTotal(){
  return cart.reduce((sum,item)=>sum+Number(item.price),0);
}

function getPincode(){
  const match=address.value.match(/\b(144\d{3})\b/);
  return match ? Number(match[1]) : null;
}

function deliveryCharge(){
  if(orderType.value!=='Home Delivery') return 0;

  const pin=getPincode();

  if(pin===null || pin<DELIVERY_PIN_MIN || pin>DELIVERY_PIN_MAX) return 0;

  return pin<=DELIVERY_CUTOFF ? 100 : 200;
}

function grandTotal(){
  return itemTotal()+deliveryCharge();
}

function renderMenu(){

  menu.innerHTML=data.map(([section,list])=>`
  <section>
    <h2 class="section-title">${esc(section)}</h2>
    <div class="grid">

    ${list.map(x=>{

      const name=x[0];
      const p=x[1];
      const img=x[2];

      if(Array.isArray(p)){

        return `
        <article class="card">
          <img src="${img}" alt="${esc(name)}"
               onerror="this.style.visibility='hidden'">

          <div class="content">
            <h3>${esc(name)}</h3>

            <div class="price">
              ₹${p[0]} / ${p[1]}
            </div>

            <div class="variant-row">

              <button class="add"
                data-name="${esc(name)} - Half"
                data-price="${p[0]}">
                Half — ₹${p[0]}
              </button>

              <button class="add"
                data-name="${esc(name)} - Full"
                data-price="${p[1]}">
                Full — ₹${p[1]}
              </button>

            </div>
          </div>
        </article>`;
      }

      if(Number(p)===0){

        return `
        <article class="card">
          <img src="${img}" alt="${esc(name)}"
               onerror="this.style.visibility='hidden'">

          <div class="content">
            <h3>${esc(name)}</h3>
            <div class="price">Price not listed</div>
          </div>
        </article>`;
      }

      return `
      <article class="card">
        <img src="${img}" alt="${esc(name)}"
             onerror="this.style.visibility='hidden'">

        <div class="content">
          <h3>${esc(name)}</h3>

          <div class="price">₹${p}</div>

          <button class="add"
            data-name="${esc(name)}"
            data-price="${p}">
            Add to Order
          </button>

        </div>
      </article>`;

    }).join('')}

    </div>
  </section>`).join('');
}

function updateDeliveryUI(){

  const isDelivery=orderType.value==='Home Delivery';

  address.style.display=isDelivery?'block':'none';

  const old=document.getElementById('deliveryInfo');

  if(old) old.remove();

  if(!isDelivery) return;

  const info=document.createElement('div');

  info.id='deliveryInfo';

  info.innerHTML=
    '<b>Delivery area:</b> Pincode 144001–144030 only. '+
    'Delivery charge: <b>₹100</b> up to 144015, '+
    '<b>₹200</b> for 144016–144030.';

  address.insertAdjacentElement('afterend',info);
}

function refresh(){

  count.textContent=cart.length;

  items.innerHTML=cart.length ?

    cart.map((x,i)=>
      `<div class="order-item">
        <b>${esc(x.name)}</b><br>
        ₹${Number(x.price)}
        <button class="remove"
          onclick="removeItem(${i})">
          Remove
        </button>
      </div>`
    ).join('')

    :

    '<div class="empty">Your cart is empty.<br>Add items from the menu.</div>';

  const subtotal=itemTotal();
  const charge=deliveryCharge();

  total.textContent=grandTotal();
  payAmount.textContent=grandTotal();

  const oldSummary=document.getElementById('billSummary');

  if(oldSummary) oldSummary.remove();

  if(cart.length){

    const summary=document.createElement('div');

    summary.id='billSummary';
    summary.className='bill-summary';

    summary.innerHTML=
      '<div>Food Total: <b>₹'+subtotal+'</b></div>'+
      '<div>Delivery Charges: <b>₹'+charge+'</b></div>';

    document
      .getElementById('total')
      .parentElement
      .insertAdjacentElement('afterend',summary);
  }

  makeUPI();
}

function makeUPI(){

  const amount=grandTotal();

  payAmount.textContent=amount;
  upiArea.innerHTML='';

  payBtn.style.display=
    method.value==='UPI' && amount>0 ? 'block':'none';

  if(!amount || method.value!=='UPI') return;

  const upi=
    'upi://pay?pa='+encodeURIComponent(UPI_ID)+
    '&pn='+encodeURIComponent('Hakka Bakka Punjabi Dhaba')+
    '&am='+amount.toFixed(2)+
    '&cu=INR';

  const box=document.createElement('div');

  box.id='qrbox';
  upiArea.appendChild(box);

  if(window.QRCode){

    new QRCode(box,{
      text:upi,
      width:230,
      height:230,
      correctLevel:QRCode.CorrectLevel.M
    });

  }else{

    const img=document.createElement('img');

    img.alt='UPI Payment QR';

    img.src=
      'https://api.qrserver.com/v1/create-qr-code/?size=230x230&data='+
      encodeURIComponent(upi);

    box.appendChild(img);
  }

  const note=document.createElement('div');

  note.id='shareNote';

  note.textContent=
    'Scan QR — ₹'+amount+
    ' total amount (including delivery, if applicable) is pre-filled.';

  upiArea.appendChild(note);
}

window.removeItem=function(i){

  if(i>=0 && i<cart.length){
    cart.splice(i,1);
    refresh();
  }
};

menu.addEventListener('click',e=>{

  const b=e.target.closest('.add');

  if(!b) return;

  const price=Number(b.dataset.price);

  if(!Number.isFinite(price)){
    alert('This item has no valid price.');
    return;
  }

  cart.push({
    name:b.dataset.name,
    price:price
  });

  panel.style.display='block';

  refresh();
});

document
.getElementById('search')
.addEventListener('input',function(){

  const q=this.value.trim().toLowerCase();

  document.querySelectorAll('section').forEach(sec=>{

    let visible=0;

    sec.querySelectorAll('.card').forEach(card=>{

      const ok=
        card.querySelector('h3')
        .textContent
        .toLowerCase()
        .includes(q);

      card.style.display=ok?'':'none';

      if(ok) visible++;
    });

    sec.style.display=visible?'':'none';
  });
});

document.getElementById('cartButton').onclick=()=>{
  panel.style.display='block';
  refresh();
};

document.getElementById('close').onclick=()=>{
  panel.style.display='none';
};

document.getElementById('clear').onclick=()=>{
  cart.length=0;
  refresh();
};

orderType.addEventListener('change',()=>{
  updateDeliveryUI();
  refresh();
});

address.addEventListener('input',()=>{
  refresh();
});

method.addEventListener('change',makeUPI);

phoneInput.setAttribute('inputmode','numeric');
phoneInput.setAttribute('maxlength','10');
phoneInput.setAttribute('minlength','10');
phoneInput.setAttribute('pattern','[0-9]{10}');

phoneInput.addEventListener('input',()=>{
  phoneInput.value=
    phoneInput.value.replace(/\D/g,'').slice(0,10);
});

/* UPI PAY BUTTON */
payBtn.addEventListener('click',()=>{

  const amount=grandTotal();

  if(!amount){
    alert('Please add items first.');
    return;
  }

  const upi=
    'upi://pay?pa='+encodeURIComponent(UPI_ID)+
    '&pn='+encodeURIComponent('Hakka Bakka Punjabi Dhaba')+
    '&am='+amount.toFixed(2)+
    '&cu=INR';

  window.location.href=upi;
});

/* WHATSAPP ORDER */
document.getElementById('wa').onclick=async function(){

  if(!cart.length){
    alert('Please add items first.');
    return;
  }

  const name=nameInput.value.trim();
  const phone=phoneInput.value.trim();

  if(!name){
    alert('Please enter customer name.');
    nameInput.focus();
    return;
  }

  if(!/^\d{10}$/.test(phone)){
    alert('Mobile number exactly 10 digits ka hona chahiye.');
    phoneInput.focus();
    return;
  }

  const type=orderType.value;
  let pin=null;

  if(type==='Home Delivery'){

    pin=getPincode();

    if(
      pin===null ||
      pin<DELIVERY_PIN_MIN ||
      pin>DELIVERY_PIN_MAX
    ){
      alert(
        'Home Delivery sirf pincode 144001 se 144030 tak available hai. '+
        'Address me valid 6-digit pincode likhein.'
      );

      address.focus();
      return;
    }
  }

  const charge=deliveryCharge();
  const subtotal=itemTotal();
  const grand=grandTotal();

  const paymentMethod=
    method.value==='UPI'
      ? 'Online UPI Payment'
      : 'Pay at Restaurant';

  const transactionId=utr.value.trim();

  const orderLines=cart.map((x,i)=>
    `${i+1}. ${x.name} - ₹${Number(x.price)}`
  ).join('\n');

  let message=
`*HAKKA BAKKA PUNJABI DHABA*
Desi Swad • Modern Vibe

*NEW ORDER*

Customer: ${name}
Mobile: ${phone}
Order Type: ${type}
${type==='Home Delivery' ? `Address: ${address.value.trim()}` : ''}

*ITEMS*
${orderLines}

Food Total: ₹${subtotal}
Delivery Charges: ₹${charge}
*GRAND TOTAL: ₹${grand}*

Payment: ${paymentMethod}
${transactionId ? `UTR / Transaction ID: ${transactionId}` : ''}

Please confirm the order.

WhatsApp: 7796631555`;

  const waUrl=
    'https://wa.me/'+WA+
    '?text='+encodeURIComponent(message);

  window.open(waUrl,'_blank');
};

renderMenu();
updateDeliveryUI();
refresh();

})();
</script>

</body>
</html>
