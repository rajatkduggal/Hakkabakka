<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7b1113">
<title>Hakka Bakka Online Menu</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f3ec;color:#171717;font-family:Arial,sans-serif}
header{background:#7b1113;color:#fff;text-align:center;padding:28px 12px}
header h1{margin:0;font-size:32px} header p{margin:8px 0;font-size:18px}
.search{position:sticky;top:0;z-index:10;background:#fff;padding:12px}
.search input{width:100%;padding:14px 16px;border:2px solid #7b1113;border-radius:12px;font-size:18px;background:#fff;color:#111}
main{padding-bottom:190px}
section{margin:18px 0}
.section-title{margin:0 12px 12px;background:#7b1113;color:#fff;padding:11px 14px;border-radius:10px;text-align:center;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0002;min-width:0}
.card img{display:block;width:100%;height:175px;object-fit:cover;background:#eee}
.content{padding:11px;text-align:center}
.content h3{font-size:16px;line-height:1.25;margin:0 0 8px}
.price{font-weight:bold;color:#7b1113;margin-bottom:9px}
.add{border:0;background:#7b1113;color:#fff;padding:9px 10px;border-radius:7px;font-weight:bold;cursor:pointer}
.variant-row{display:flex;gap:6px;justify-content:center}
.variant-row .add{flex:1;min-width:0;font-size:13px;padding:9px 5px}
.cartDock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;box-shadow:0 -4px 18px #0003;border-top:3px solid #7b1113;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
.cartDockHead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#7b1113;margin-bottom:6px}.cartDockItems{display:flex;gap:8px;overflow-x:auto;max-height:58px;padding-bottom:3px}.cartChip{flex:0 0 auto;background:#f7f3ec;border:1px solid #ddd;border-radius:8px;padding:6px 9px;font-size:13px}.cartDockBottom{display:flex;align-items:center;gap:8px;margin-top:7px}.cartDockTotal{font-size:16px;flex:1}.cartDock .action{margin:0!important;padding:10px 12px!important;width:auto!important}.cartDock .clearCart{background:#333}.badge{font-size:13px;background:#fff;color:#7b1113;border-radius:12px;padding:2px 6px}
.panel{display:none;position:fixed;inset:0 0 0 auto;width:min(430px,100%);background:#fff;z-index:40;padding:18px;overflow:auto;box-shadow:-4px 0 18px #0005}
.panel h2{margin-top:0;color:#7b1113}
.order-item{padding:10px 0;border-bottom:1px solid #ddd}
.panel input,.panel textarea,.panel select{width:100%;padding:11px;margin:6px 0;border:1px solid #aaa;border-radius:7px;font-size:16px}
.panel button.action{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#7b1113;color:#fff;font-weight:bold}
.panel button.close{background:#333}
.empty{text-align:center;padding:40px;color:#555}
#paymentBox{margin-top:14px;padding:14px;border:2px solid #7b1113;border-radius:10px;background:#fff8f0}
#qrbox{display:flex;justify-content:center;margin:10px 0}
#qrbox img{width:230px;height:230px}
#shareNote{font-size:13px;color:#555;text-align:center;margin-top:7px}
.remove{margin-top:5px;padding:5px 9px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);padding:0 10px;gap:10px}.card img{height:145px}.section-title{margin-left:10px;margin-right:10px}}
@media(max-width:390px){.card img{height:125px}.content h3{font-size:14px}}

.fieldLabel{display:block;font-weight:bold;margin:10px 0 4px}.cartSubtotal{padding:12px 0;border-top:1px solid #ddd;margin-top:8px;font-size:17px}.billBox{margin-top:14px;padding:12px;border:2px solid #7b1113;border-radius:10px;background:#fff8f0}.billBox>div{display:flex;justify-content:space-between;padding:5px 0}.billBox .grand{border-top:1px solid #caa;margin-top:6px;padding-top:10px;font-size:19px}.deliveryInfo{font-size:13px;margin:5px 0 8px;padding:8px;border-radius:7px;background:#f7f3ec;color:#555}.paymentStatus{font-size:13px;color:#555;text-align:center}.shareNote{font-size:13px;color:#555;text-align:center;margin-top:7px}.remove{margin-left:8px;padding:5px 8px;border:1px solid #aaa;border-radius:5px;background:#fff}.order-item{padding:12px 0;border-bottom:1px solid #ddd}.order-item>div{margin-top:6px}.empty{text-align:center;padding:35px 10px;color:#555}#paymentBox{margin-top:14px;padding:14px;border:2px solid #7b1113;border-radius:10px;background:#fff8f0}#paymentBox h3{margin:0 0 8px;color:#7b1113}#paymentBox input[type=file]{font-size:14px}</style>
</head>
<body>

<div class="search"><input id="search" type="search" placeholder="Search menu..." autocomplete="off"></div>

  <div id="items" class="cartDockItems"><div class="empty">Cart empty</div></div>
  <div class="cartDockBottom">
    <div class="cartDockTotal">Food Total: <b>₹<span id="cartDockTotal">0</span></b></div>
    <button class="action clearCart" id="cartClear">Clear</button>
    <button class="action" id="proceedBtn">Proceed to Billing</button>
  </div>
</div>

<div class="panel" id="cartPanel">
  <div id="billingView" style="display:none">
    <h2>🧾 Billing</h2>
    <input id="customerName" placeholder="Customer Name" autocomplete="name">
    <input id="customerPhone" placeholder="10-digit Mobile Number" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">

    <label class="fieldLabel">Order Type</label>
    <select id="orderType">
      <option value="Pickup">Pickup</option>
      <option value="Home Delivery">Home Delivery</option>
    </select>

    <div id="deliveryFields" style="display:none">
      <textarea id="address" rows="3" placeholder="Delivery Address"></textarea>
      <input id="pincode" placeholder="Pincode (144001–144030)" type="tel" inputmode="numeric" maxlength="6">
      <div id="deliveryInfo" class="deliveryInfo">Delivery available only in pincode 144001–144030.</div>
    </div>

    <div class="billBox">
      <div>Food Total <span>₹<b id="billFood">0</b></span></div>
      <div>Delivery Charges <span>₹<b id="billDelivery">0</b></span></div>
      <div class="grand"><strong>Total Amount</strong><strong>₹<span id="billTotal">0</span></strong></div>
    </div>

    <div id="paymentBox">
      <h3>💳 Pay with UPI</h3>
      <p><b>UPI ID:</b> 9713545556@pthdfc</p>
      <div id="upiArea"></div>
      <button class="action" id="upiPay" type="button">Pay with UPI</button>
      <p id="paymentStatus" class="paymentStatus"></p>
      <input id="utr" placeholder="UPI UTR / Transaction ID (optional)" inputmode="numeric">
      <label class="fieldLabel">Payment Screenshot (optional)</label>
      <input id="paymentScreenshot" type="file" accept="image/*">
    </div>

    <button class="action" id="wa">Send Order on WhatsApp</button>
    <button class="action close" id="backToCart">← Back to Cart</button>
  </div>
</div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

["Lemon Chicken",["270","450"],"images/lemon chicken.jpg"],

]],
["Soda, Water & Cold Drinks",[
["Pepsi","0","images/cold_drink.png"],["7UP","0","images/cold_drink.png"],
["Mountain Dew","0","images/cold_drink.png"],["Bottled Water","0","images/water.png"],
["Coca-Cola","0","images/cold_drink.png"],["Fanta","0","images/cold_drink.png"],
["Other Soft Drinks","0","images/cold_drink.png"]
]],
["Shakes",[["Shakes (Any Flavour)","100","images/milkshake.png"]]]
];
const menu=document.getElementById('menu');
const panel=document.getElementById('cartPanel');
const items=document.getElementById('items');
const count=document.getElementById('count');
const cartSubtotal=document.getElementById('cartSubtotal');
const cartDockTotal=document.getElementById('cartDockTotal');
const billingView=document.getElementById('billingView');
const nameInput=document.getElementById('customerName');
const phoneInput=document.getElementById('customerPhone');
const orderType=document.getElementById('orderType');
const deliveryFields=document.getElementById('deliveryFields');
const address=document.getElementById('address');
const pincode=document.getElementById('pincode');
const billFood=document.getElementById('billFood');
const billDelivery=document.getElementById('billDelivery');
const billTotal=document.getElementById('billTotal');
const upiArea=document.getElementById('upiArea');
const upiPay=document.getElementById('upiPay');
const paymentStatus=document.getElementById('paymentStatus');
const utr=document.getElementById('utr');
const shot=document.getElementById('paymentScreenshot');

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function foodTotal(){return cart.reduce((s,x)=>s+(Number(x.price)||0),0)}
function pinNumber(){const n=Number(pincode.value);return /^144\d{3}$/.test(pincode.value)?n:null}
function deliveryCharge(){
  if(orderType.value!=='Home Delivery') return 0;
  const pin=pinNumber();
  if(pin===null || pin<PIN_MIN || pin>PIN_MAX) return 0;
  return pin<=PIN_CUTOFF ? 100 : 200;
}
function grandTotal(){return foodTotal()+deliveryCharge()}
function renderMenu(){
 menu.innerHTML=data.map(([section,list])=>`<section><h2 class="section-title">${esc(section)}</h2><div class="grid">${list.map(x=>{
  const name=x[0],p=x[1],img=x[2];
  if(Array.isArray(p)) return `<article class="card"><img src="${img}" alt="${esc(name)}" onerror="this.style.visibility='hidden'"><div class="content"><h3>${esc(name)}</h3><div class="price">₹${p[0]} / ${p[1]}</div><div class="variant-row"><button class="add" data-name="${esc(name)} - Half" data-price="${p[0]}">Half — ₹${p[0]}</button><button class="add" data-name="${esc(name)} - Full" data-price="${p[1]}">Full — ₹${p[1]}</button></div></div></article>`;
  if(Number(p)===0) return `<article class="card"><img src="${img}" alt="${esc(name)}" onerror="this.style.visibility='hidden'"><div class="content"><h3>${esc(name)}</h3><div class="price">Price not listed</div></div></article>`;
  return `<article class="card"><img src="${img}" alt="${esc(name)}" onerror="this.style.visibility='hidden'"><div class="content"><h3>${esc(name)}</h3><div class="price">₹${p}</div><button class="add" data-name="${esc(name)}" data-price="${p}">Add to Order</button></div></article>`;
 }).join('')}</div></section>`).join('');
}
function renderCart(){
 count.textContent=cart.length;
 cartSubtotal.textContent='₹'+foodTotal();
 cartDockTotal.textContent=foodTotal();
 items.innerHTML=cart.length?cart.map((x,i)=>`<div class="order-item"><b>${esc(x.name)}</b><div>₹${Number(x.price)} <button class="remove" onclick="removeItem(${i})">Remove</button></div></div>`).join(''):'<div class="empty">Your cart is empty.<br>Add items from the menu.</div>';
}
function updateBilling(){
 const delivery=orderType.value==='Home Delivery';
 deliveryFields.style.display=delivery?'block':'none';
 const food=foodTotal(),charge=deliveryCharge(),total=food+charge;
 billFood.textContent=food;billDelivery.textContent=charge;billTotal.textContent=total;
 if(delivery){
   const pin=pinNumber();
   document.getElementById('deliveryInfo').innerHTML=pin===null?'Delivery: enter pincode 144001–144030.':'Delivery charge: <b>₹'+(charge||0)+'</b> — 144001–144015: ₹100, 144016–144030: ₹200.';
 }
 makeUPI();
}
function makeUPI(){
 const amount=grandTotal();upiArea.innerHTML='';paymentStatus.textContent='';
 if(!amount){upiPay.style.display='none';return;}
 upiPay.style.display='block';
 const upi='upi://pay?pa='+encodeURIComponent(UPI_ID)+'&pn='+encodeURIComponent('Hakka Bakka Punjabi Dhaba')+'&am='+amount.toFixed(2)+'&cu=INR';
 const box=document.createElement('div');box.id='qrbox';upiArea.appendChild(box);
 if(window.QRCode)new QRCode(box,{text:upi,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});
 const note=document.createElement('div');note.className='shareNote';note.textContent='Scan QR or tap Pay with UPI. Amount ₹'+amount+' is pre-filled.';upiArea.appendChild(note);
 upiPay.onclick=()=>{paymentStatus.textContent='UPI app opening…';window.location.href=upi;};
}
window.removeItem=function(i){if(i>=0&&i<cart.length){cart.splice(i,1);renderCart();updateBilling();}};
menu.addEventListener('click',e=>{const b=e.target.closest('.add');if(!b)return;const price=Number(b.dataset.price);if(!Number.isFinite(price))return;cart.push({name:b.dataset.name,price});renderCart();});
document.getElementById('cartClear').onclick=()=>{cart.length=0;renderCart();updateBilling();};
document.getElementById('proceedBtn').onclick=()=>{if(!cart.length){alert('Cart is empty.');return;}panel.style.display='block';billingView.style.display='block';updateBilling();};
document.getElementById('backToCart').onclick=()=>{panel.style.display='none';};
orderType.addEventListener('change',updateBilling);
pincode.addEventListener('input',()=>{pincode.value=pincode.value.replace(/\D/g,'').slice(0,6);updateBilling();});
phoneInput.addEventListener('input',()=>{phoneInput.value=phoneInput.value.replace(/\D/g,'').slice(0,10);});
address.addEventListener('input',()=>{});
document.getElementById('search').addEventListener('input',function(){const q=this.value.trim().toLowerCase();document.querySelectorAll('section').forEach(sec=>{let v=0;sec.querySelectorAll('.card').forEach(card=>{const ok=card.querySelector('h3').textContent.toLowerCase().includes(q);card.style.display=ok?'':'none';if(ok)v++;});sec.style.display=v?'':'none';});});
document.getElementById('wa').onclick=()=>{
 if(!cart.length)return alert('Cart is empty.');
 const name=nameInput.value.trim(),phone=phoneInput.value.trim(),type=orderType.value;
 if(!name){alert('Customer name enter karein.');nameInput.focus();return;}
 if(!/^\d{10}$/.test(phone)){alert('Mobile number exactly 10 digits ka hona chahiye.');phoneInput.focus();return;}
 let pin=null,addr='Not required (Pickup)';
 if(type==='Home Delivery'){
   pin=pinNumber();addr=address.value.trim();
   if(!addr){alert('Delivery address enter karein.');address.focus();return;}
   if(pin===null||pin<PIN_MIN||pin>PIN_MAX){alert('Home Delivery sirf pincode 144001 se 144030 tak available hai.');pincode.focus();return;}
 }
 const food=foodTotal(),charge=deliveryCharge(),total=food+charge;
 const lines=cart.map(x=>'• '+x.name+' - ₹'+Number(x.price)).join('\n');
 const msg=`*HAKKA BAKKA ONLINE ORDER*\n\n${lines}\n\nFood Total: ₹${food}\nDelivery Charges: ₹${charge}\n*TOTAL: ₹${total}*\n\nName: ${name}\nMobile: ${phone}\nType: ${type}\n${type==='Home Delivery'?'Pincode: '+pin+'\nAddress: '+addr:'Pickup: Hakka Bakka Punjabi Dhaba'}`;
 /* WhatsApp cannot be made to press Send automatically by a website. This opens the WhatsApp chat with the order text ready; customer only taps Send. */
 window.location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
};
renderMenu();renderCart();updateBilling();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=6',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));}
})();
</script>
